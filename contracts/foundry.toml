[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = false
bytecode_hash = "ipfs"
cbor_metadata = true
use_literal_content = true
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

# Fork tests only. Do not set eth_rpc_url here or every `forge test` becomes a Mainnet fork.
[rpc_endpoints]
monad_mainnet = "${MONAD_RPC_URL}"
