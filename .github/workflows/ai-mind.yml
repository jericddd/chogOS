# Pokes the production mind, then broadcasts pending wallet decisions.
# GitHub only fires `schedule` from the default branch (`main` today).
# The issuer checks out the production branch, where the broadcaster lives.
# The agent key can move MON out of every citizen wallet. It stays in GitHub
# Actions secrets. The website never receives it.
name: AI mind

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: ai-mind
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Call POST /api/ai/run
        env:
          AI_RUNNER_SECRET: ${{ secrets.AI_RUNNER_SECRET }}
          AI_RUNNER_URL: ${{ vars.AI_RUNNER_URL }}
        run: |
          set -euo pipefail
          url="${AI_RUNNER_URL:-https://chogos.vercel.app/api/ai/run}"
          if [ -z "${AI_RUNNER_SECRET:-}" ]; then
            echo "Add repository secret AI_RUNNER_SECRET (same value as Vercel AI_RUNNER_SECRET)."
            echo "https://github.com/jericddd/chogOS/settings/secrets/actions"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              exit 1
            fi
            exit 0
          fi
          code="$(curl -sS -o /tmp/ai-mind.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${AI_RUNNER_SECRET}" \
            -H "Content-Type: application/json" \
            -H "x-chog-ai-wait: long" \
            --max-time 260 \
            "$url")"
          python3 -c 'from pathlib import Path; print(Path("/tmp/ai-mind.json").read_text()[:2000])'
          echo "http $code"
          if [ "$code" = "200" ]; then
            exit 0
          fi
          echo "Mind runner returned HTTP $code"
          exit 1

  issue:
    needs: run
    if: always() && needs.run.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check issuer secrets
        id: gate
        env:
          WALLET_ISSUER_AGENT_KEY: ${{ secrets.WALLET_ISSUER_AGENT_KEY }}
          WALLET_ISSUER_GAS_KEY: ${{ secrets.WALLET_ISSUER_GAS_KEY }}
          AI_RUNNER_SECRET: ${{ secrets.AI_RUNNER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${WALLET_ISSUER_AGENT_KEY:-}" ] || [ -z "${WALLET_ISSUER_GAS_KEY:-}" ] || [ -z "${AI_RUNNER_SECRET:-}" ]; then
            echo "Add repository secrets WALLET_ISSUER_AGENT_KEY, WALLET_ISSUER_GAS_KEY, and AI_RUNNER_SECRET."
            echo "https://github.com/jericddd/chogOS/settings/secrets/actions"
            echo "Copy each key from your notes. The website does not receive these keys."
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: cursor/phase-1-genesis-world-155c

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Broadcast pending wallet decisions
        if: steps.gate.outputs.ready == 'true'
        env:
          WALLET_ISSUER_AGENT_KEY: ${{ secrets.WALLET_ISSUER_AGENT_KEY }}
          WALLET_ISSUER_GAS_KEY: ${{ secrets.WALLET_ISSUER_GAS_KEY }}
          AI_RUNNER_SECRET: ${{ secrets.AI_RUNNER_SECRET }}
          AI_RUNNER_URL: ${{ vars.AI_RUNNER_URL }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/issue-wallet-decisions.ts ]; then
            echo "The production branch does not have the wallet issuer yet."
            exit 0
          fi
          npm ci
          npx tsx scripts/issue-wallet-decisions.ts
