# Pokes the production mind, then broadcasts pending wallet decisions
# and accepted ChogBank allocations. The authorizer key signs distribute.
# The gas key pays gas. The wallet agent key is not used for payouts.
# GitHub only fires `schedule` from the default branch (`main` today).
# The issuer checks out the production branch, where the broadcaster lives.
# The agent key can move MON out of every citizen wallet. It stays in GitHub
# Actions secrets. The website never receives it.
name: AI mind

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: ai-mind
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Call POST /api/ai/run
        env:
          AI_RUNNER_SECRET: ${{ secrets.AI_RUNNER_SECRET }}
          AI_RUNNER_URL: ${{ vars.AI_RUNNER_URL }}
        run: |
          set -euo pipefail
          url="${AI_RUNNER_URL:-https://chogos.vercel.app/api/ai/run}"
          if [ -z "${AI_RUNNER_SECRET:-}" ]; then
            echo "Add repository secret AI_RUNNER_SECRET (same value as Vercel AI_RUNNER_SECRET)."
            echo "https://github.com/jericddd/chogOS/settings/secrets/actions"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              exit 1
            fi
            exit 0
          fi
          # Vercel allows 300s. Cold start sits inside this curl. The route
          # returns a body by 250s of function time, then one retry covers a
          # warm poke if the first connection still closes empty.
          poke() {
            curl -sS -o /tmp/ai-mind.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${AI_RUNNER_SECRET}" \
              -H "Content-Type: application/json" \
              -H "x-chog-ai-wait: long" \
              --max-time 290 \
              "$url" || true
          }
          code="$(poke)"
          if [ "$code" != "200" ]; then
            echo "Mind runner returned HTTP ${code:-000}. Retrying once."
            sleep 5
            code="$(poke)"
          fi
          python3 -c 'from pathlib import Path; p = Path("/tmp/ai-mind.json"); print(p.read_text()[:2000] if p.exists() else "")'
          echo "http $code"
          if [ "$code" = "200" ]; then
            exit 0
          fi
          echo "Mind runner returned HTTP $code"
          exit 1

  issue:
    needs: run
    # A failed poke must not freeze a queued wallet or an accepted payout.
    if: always() && needs.run.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check issuer secrets
        id: gate
        env:
          WALLET_ISSUER_AGENT_KEY: ${{ secrets.WALLET_ISSUER_AGENT_KEY }}
          WALLET_ISSUER_GAS_KEY: ${{ secrets.WALLET_ISSUER_GAS_KEY }}
          AI_RUNNER_SECRET: ${{ secrets.AI_RUNNER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${WALLET_ISSUER_AGENT_KEY:-}" ] || [ -z "${WALLET_ISSUER_GAS_KEY:-}" ] || [ -z "${AI_RUNNER_SECRET:-}" ]; then
            echo "Add repository secrets WALLET_ISSUER_AGENT_KEY, WALLET_ISSUER_GAS_KEY, and AI_RUNNER_SECRET."
            echo "https://github.com/jericddd/chogOS/settings/secrets/actions"
            echo "Copy each key from your notes. The website does not receive these keys."
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: cursor/phase-1-genesis-world-155c

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Broadcast pending wallet decisions
        if: steps.gate.outputs.ready == 'true'
        env:
          WALLET_ISSUER_AGENT_KEY: ${{ secrets.WALLET_ISSUER_AGENT_KEY }}
          WALLET_ISSUER_GAS_KEY: ${{ secrets.WALLET_ISSUER_GAS_KEY }}
          AI_RUNNER_SECRET: ${{ secrets.AI_RUNNER_SECRET }}
          AI_RUNNER_URL: ${{ vars.AI_RUNNER_URL }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/issue-wallet-decisions.ts ]; then
            echo "The production branch does not have the wallet issuer yet."
            exit 0
          fi
          npm ci
          npx tsx scripts/issue-wallet-decisions.ts

  pay:
    needs: issue
    if: always() && needs.issue.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check payout secrets
        id: gate
        env:
          CHOG_BANK_AUTHORIZER_KEY: ${{ secrets.CHOG_BANK_AUTHORIZER_KEY }}
          WALLET_ISSUER_GAS_KEY: ${{ secrets.WALLET_ISSUER_GAS_KEY }}
          AI_RUNNER_SECRET: ${{ secrets.AI_RUNNER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CHOG_BANK_AUTHORIZER_KEY:-}" ] || [ -z "${WALLET_ISSUER_GAS_KEY:-}" ] || [ -z "${AI_RUNNER_SECRET:-}" ]; then
            echo "Add repository secrets CHOG_BANK_AUTHORIZER_KEY, WALLET_ISSUER_GAS_KEY, and AI_RUNNER_SECRET."
            echo "https://github.com/jericddd/chogOS/settings/secrets/actions"
            echo "Copy the authorizer key from your notes. The website does not receive it. The wallet agent key is not used for payouts."
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: cursor/phase-1-genesis-world-155c

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Broadcast accepted ChogBank allocations
        if: steps.gate.outputs.ready == 'true'
        env:
          CHOG_BANK_AUTHORIZER_KEY: ${{ secrets.CHOG_BANK_AUTHORIZER_KEY }}
          WALLET_ISSUER_GAS_KEY: ${{ secrets.WALLET_ISSUER_GAS_KEY }}
          AI_RUNNER_SECRET: ${{ secrets.AI_RUNNER_SECRET }}
          AI_RUNNER_URL: ${{ vars.AI_RUNNER_URL }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/broadcast-chogbank-payouts.ts ]; then
            echo "The production branch does not have the ChogBank payout broadcaster yet."
            exit 0
          fi
          npm ci
          npx tsx scripts/broadcast-chogbank-payouts.ts
