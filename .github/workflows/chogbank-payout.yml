# Pays exactly one stored ChogBank allocation. It does not call the AI mind
# and it does not pay any other decision. The authorizer key signs distribute.
# The gas key pays gas. The wallet agent key is not used.
# Run this by hand from the branch that contains this file. Do not add a cron.
name: ChogBank payout

on:
  workflow_dispatch:
    inputs:
      decision_id:
        description: "One stored ChogBank decision id, 0x and 64 hex characters"
        required: true
        type: string

concurrency:
  group: chogbank-payout
  cancel-in-progress: false

jobs:
  pay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check the decision id
        id: decision
        env:
          DECISION_ID: ${{ inputs.decision_id }}
        run: |
          set -euo pipefail
          id="$(printf '%s' "${DECISION_ID:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if ! printf '%s' "$id" | grep -Eq '^0x[0-9a-f]{64}$'; then
            echo "Enter one stored decision id, 0x and 64 hex characters. Nothing was signed."
            exit 1
          fi
          echo "decision_id=$id" >> "$GITHUB_OUTPUT"

      - name: Check payout secrets
        id: gate
        env:
          CHOG_BANK_AUTHORIZER_KEY: ${{ secrets.CHOG_BANK_AUTHORIZER_KEY }}
          WALLET_ISSUER_GAS_KEY: ${{ secrets.WALLET_ISSUER_GAS_KEY }}
          AI_RUNNER_SECRET: ${{ secrets.AI_RUNNER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CHOG_BANK_AUTHORIZER_KEY:-}" ] || [ -z "${WALLET_ISSUER_GAS_KEY:-}" ] || [ -z "${AI_RUNNER_SECRET:-}" ]; then
            echo "Add repository secrets CHOG_BANK_AUTHORIZER_KEY, WALLET_ISSUER_GAS_KEY, and AI_RUNNER_SECRET."
            echo "https://github.com/jericddd/chogOS/settings/secrets/actions"
            echo "Copy the authorizer key from your notes. The website does not receive it. The wallet agent key is not used for payouts."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: cursor/phase-1-genesis-world-155c

      - name: Refuse a checkout that still pays every allocation
        run: |
          set -euo pipefail
          if [ ! -f scripts/broadcast-chogbank-payouts.ts ]; then
            echo "This checkout has no ChogBank payout broadcaster. Nothing was signed."
            exit 1
          fi
          if ! grep -q "CHOG_BANK_DECISION_ID" scripts/broadcast-chogbank-payouts.ts; then
            echo "This checkout cannot pay one stored decision. Nothing was signed."
            exit 1
          fi
          if ! grep -q "selectManualPayout" scripts/broadcast-chogbank-payouts.ts; then
            echo "This checkout cannot pay one stored decision. Nothing was signed."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Broadcast one stored ChogBank allocation
        env:
          CHOG_BANK_DECISION_ID: ${{ steps.decision.outputs.decision_id }}
          CHOG_BANK_AUTHORIZER_KEY: ${{ secrets.CHOG_BANK_AUTHORIZER_KEY }}
          WALLET_ISSUER_GAS_KEY: ${{ secrets.WALLET_ISSUER_GAS_KEY }}
          AI_RUNNER_SECRET: ${{ secrets.AI_RUNNER_SECRET }}
          AI_RUNNER_URL: ${{ vars.AI_RUNNER_URL }}
        run: |
          set -euo pipefail
          npm ci
          npx tsx scripts/broadcast-chogbank-payouts.ts
